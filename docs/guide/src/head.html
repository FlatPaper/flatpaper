<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: lab-notebook guide. Sticky index on wide screens, one reading column, pass/fail marks as the recurring device. */
:root {
  --bg: #f5f7f4;
  --surface: #ffffff;
  --fg: #18211d;
  --muted: #59655f;
  --rule: #d9dfdb;
  --accent: #0d6b58;
  --accent-soft: #e2efe9;
  --pass: #1f7a3d;
  --fail: #b03a2a;
  --fail-soft: #f7e6e2;
  --pass-soft: #e3f1e6;
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --surface: #18201c; --fg: #e4ebe7; --muted: #9aa8a1; --rule: #2b3631;
    --accent: #5cc7a8; --accent-soft: #1c3029; --pass: #6fcf8a; --fail: #f08a78;
    --fail-soft: #3a211d; --pass-soft: #1b3123; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --surface: #18201c; --fg: #e4ebe7; --muted: #9aa8a1; --rule: #2b3631;
  --accent: #5cc7a8; --accent-soft: #1c3029; --pass: #6fcf8a; --fail: #f08a78;
  --fail-soft: #3a211d; --pass-soft: #1b3123; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 var(--font-body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 64px; }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 48px; }
.wrap.single { grid-template-columns: minmax(0, 1fr); max-width: 860px; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 0; } nav.toc { display: none; } }
header.top { max-width: 1120px; margin: 0 auto; padding-block: 48px 32px; border-bottom: 1px solid var(--rule); margin-bottom: 32px; }
.eyebrow { font: 600 12px/1.4 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { font: 800 clamp(34px, 6vw, 56px)/1.05 var(--font-display); margin: 8px 0 12px; text-wrap: balance; letter-spacing: -.01em; }
.lede { max-width: 64ch; color: var(--muted); font-size: 18px; margin: 0; }
.five { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.five span { font: 600 13px/1 var(--font-mono); padding: 8px 10px; border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); }
nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; font-size: 14px; max-height: calc(100vh - 48px); overflow-y: auto; }
nav.toc .grp { font: 600 11px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 8px 6px; }
nav.toc .grp:first-child { margin-top: 0; }
nav.toc ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; }
nav.toc a { display: grid; grid-template-columns: 36px 1fr; color: var(--muted); text-decoration: none; padding: 4px 8px; border-radius: 4px; }
nav.toc a:hover, nav.toc a:focus-visible { background: var(--accent-soft); color: var(--fg); outline: none; }
nav.toc .n { font-family: var(--font-mono); color: var(--accent); }
main { min-width: 0; }
.part { font: 600 12px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border-top: 2px solid var(--fg); padding-top: 10px; margin: 8px 0 28px; }
section.ch { padding-block: 8px 40px; border-bottom: 1px solid var(--rule); margin-bottom: 40px; scroll-margin-top: 24px; }
section.ch.last { border-bottom: 0; }
.chnum { font: 600 12px/1 var(--font-mono); color: var(--accent); letter-spacing: .08em; text-transform: uppercase; }
h2 { font: 800 30px/1.15 var(--font-display); margin: 6px 0 10px; text-wrap: balance; }
h3 { font: 600 18px/1.3 var(--font-body); margin: 32px 0 10px; }
p { max-width: 68ch; margin: 0 0 12px; }
.claim { font-size: 19px; max-width: 64ch; border-left: 3px solid var(--accent); padding-left: 16px; margin: 12px 0 20px; }
code, .mono { font-family: var(--font-mono); font-size: .9em; }
:not(pre) > code { background: var(--accent-soft); padding: 1px 5px; border-radius: 3px; overflow-wrap: anywhere; }
pre { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px; overflow-x: auto; font: 13.5px/1.55 var(--font-mono); margin: 12px 0 16px; white-space: pre; }
.tbl { overflow-x: auto; margin: 12px 0 16px; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font: 600 12px/1.3 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
td.nw { white-space: nowrap; }
ul.tight, ol.tight { padding-left: 20px; margin: 8px 0 14px; max-width: 68ch; }
ul.tight li, ol.tight li { margin-bottom: 4px; }
.pf { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin: 12px 0 16px; }
.pf > div { border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; background: var(--surface); min-width: 0; }
.mark { font: 600 11px/1 var(--font-mono); letter-spacing: .08em; padding: 4px 6px; border-radius: 3px; display: inline-block; margin-bottom: 8px; }
.mark.fail { color: var(--fail); background: var(--fail-soft); }
.mark.pass { color: var(--pass); background: var(--pass-soft); }
.pf p { margin: 0; font-size: 15px; }
.takeaway { background: var(--accent-soft); border-radius: 6px; padding: 12px 16px; margin: 20px 0 0; max-width: 72ch; }
.takeaway b { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 2px; }
.entries { display: grid; gap: 12px; margin: 12px 0 8px; }
.entry { border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); padding: 14px 16px; min-width: 0; scroll-margin-top: 24px; }
.entry h4 { font: 600 16px/1.3 var(--font-mono); margin: 0 0 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.entry dl { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 15px; }
.entry dt { font: 600 11px/1.9 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.entry dd { margin: 0; max-width: 68ch; }
@media (max-width: 560px) { .entry dl { grid-template-columns: minmax(0, 1fr); gap: 2px; } .entry dd { margin-bottom: 8px; } }
.cmd { border-top: 1px solid var(--rule); padding-top: 16px; margin-top: 20px; scroll-margin-top: 24px; }
.cmd h4 { font: 600 17px/1.3 var(--font-mono); margin: 0 0 6px; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.cmd p { margin-bottom: 8px; }
footer { max-width: 1120px; margin: 24px auto 0; color: var(--muted); font-size: 14px; border-top: 1px solid var(--rule); padding-top: 16px; }
a { color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tag { font: 600 11px/1 var(--font-mono); color: var(--muted); border: 1px solid var(--rule); border-radius: 3px; padding: 3px 5px; white-space: nowrap; letter-spacing: 0; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
